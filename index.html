<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nano Banana 2 Automated Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }
        body { background: #f9fafb; color: #111827; padding: 40px 20px; }
        .wrapper { max-width: 1200px; margin: 0 auto; text-align: center; }
        .upload-card { background: white; border: 2px dashed #cfd4dc; border-radius: 12px; padding: 40px; margin: 30px auto; max-width: 500px; cursor: pointer; }
        .run-btn { background: #ffe600; color: #000; border: none; padding: 16px 40px; border-radius: 8px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: transform 0.2s; box-shadow: 0 4px 10px rgba(255, 230, 0, 0.3); }
        .run-btn:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; box-shadow: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 40px; }
        .result-card { background: white; border-radius: 10px; border: 1px solid #e5e7eb; overflow: hidden; padding: 15px; }
        .result-card img { width: 100%; height: 280px; object-fit: contain; background: #fafafa; border-radius: 6px; }
        .label { font-weight: 600; font-size: 0.95rem; margin-top: 10px; display: block; }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>Nano Banana 2 Automated Studio</h1>
        <p>Drop your original ring image. The AI will read your 9 saved configurations, think, and export the renders.</p>

        <div class="upload-card" onclick="document.getElementById('ringInput').click()">
            <p id="uploadTxt">Click to upload your original ring photograph</p>
            <input type="file" id="ringInput" accept="image/*" style="display: none;">
        </div>

        <button id="executeBtn" class="run-btn" disabled>Generate 9 Nano Banana 2 Poses</button>
        <div id="status" style="margin-top: 15px; font-weight: 500; color: #4b5563;"></div>

        <div id="outputGrid" class="grid"></div>
    </div>

    <script src="https://js.puter.com/v2/"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
