<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dynamic Jewelry Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Dynamic Jewelry Studio</h1>
            <p>Upload your master ring, define your 9 custom target poses, and let the AI think and generate.</p>
        </header>

        <div class="master-upload-box">
            <h3>1. Upload Master Ring Photo</h3>
            <input type="file" id="masterImageInput" accept="image/*">
            <label for="masterImageInput" class="btn-master">Select Original Ring Image</label>
            <div id="masterPreview"></div>
        </div>

        <h3>2. Configure Your 9 Target Poses</h3>
        <div id="slotsContainer" class="slots-grid"></div>

        <div class="action-bar">
            <button id="startAutomationBtn" class="btn-run" disabled>Run AI Thinking & Generation Engine</button>
        </div>
    </div>

    <script src="https://js.puter.com/v2/"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
