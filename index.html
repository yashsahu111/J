<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nano Banana 2 - 9-Pose Automation Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: #f3f4f6; color: #111827; padding: 40px 20px; }
        .app-container { max-width: 1300px; margin: 0 auto; text-align: center; }
        .hero { margin-bottom: 30px; }
        .master-dropzone { background: white; border: 3px dashed #cbd5e1; border-radius: 16px; padding: 50px; max-width: 600px; margin: 0 auto 30px; cursor: pointer; transition: border-color 0.2s; }
        .master-dropzone:hover { border-color: #ffe600; }
        .master-dropzone img { max-height: 200px; margin-top: 15px; border-radius: 8px; }
        .action-btn { background: #ffe600; color: black; border: none; font-size: 1.2rem; font-weight: 700; padding: 16px 50px; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 14px rgba(255,230,0,0.4); }
        .action-btn:disabled { background: #e5e7eb; color: #9ca3af; box-shadow: none; cursor: not-allowed; }
        .grid-output { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; margin-top: 40px; }
        .pose-box { background: white; border-radius: 12px; border: 1px solid #e5e7eb; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .pose-box img { width: 100%; height: 300px; object-fit: contain; background: #fafafa; border-radius: 8px; }
        .pose-meta { font-weight: 600; font-size: 1rem; margin-top: 12px; display: block; color: #374151; }
        .dl-btn { display: inline-block; width: 100%; background: #2563eb; color: white; text-decoration: none; text-align: center; padding: 10px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="hero">
            <h1>Nano Banana 2 Jewelry Automation</h1>
            <p>Upload a new ring photo below. The AI will cross-reference your 9 pre-saved poses to generate the output.</p>
        </div>

        <div class="master-dropzone" onclick="document.getElementById('ringFile').click()">
            <p id="promptText">Drag & drop or click to upload your New Ring Photo</p>
            <input type="file" id="ringFile" accept="image/*" style="display: none;">
            <div id="previewArea"></div>
        </div>

        <button id="runEngineBtn" class="action-btn" disabled>Generate 9 Re-Posed Renders</button>
        <p id="globalStatus" style="margin-top: 15px; font-weight: 600; color: #4b5563;"></p>

        <div id="gridOutput" class="grid-output"></div>
    </div>

    <script src="https://js.puter.com/v2/"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
