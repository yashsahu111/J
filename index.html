<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nano Banana 2 - Fixed 7-Pose Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="hero">
            <h1>Dynamic 7-Pose Production Studio</h1>
            <p>Upload your watermark-free ring photo. The engine will instantly map it into your 7 saved preset templates.</p>
        </div>

        <div class="master-dropzone" onclick="document.getElementById('ringFile').click()">
            <p id="promptText">Click here to select your product ring photograph</p>
            <input type="file" id="ringFile" accept="image/*" style="display: none;">
            <div id="previewArea"></div>
        </div>

        <button id="runEngineBtn" class="action-btn" disabled>Run Nano Banana 2 Automation</button>
        <p id="globalStatus" style="margin-top: 20px; font-weight: 700; color: #475569;"></p>

        <div id="gridOutput" class="grid-output"></div>
    </div>

    <script src="https://js.puter.com/v2/"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
